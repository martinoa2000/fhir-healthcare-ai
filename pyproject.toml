[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir-healthcare-ai"
version = "0.1.0"
description = "A governed AI layer over interoperable clinical data (HL7 FHIR R4)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "fhir-healthcare-ai contributors" }]
keywords = ["fhir", "hl7", "healthcare", "interoperability", "llm", "clinical-nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The default backend (`vllm`) needs nothing here: it speaks the OpenAI-compatible HTTP
# API with the httpx already in `dependencies`, so the app container stays free of CUDA
# and the model runs as its own service.
hf = ["transformers>=4.44", "torch>=2.4", "accelerate>=0.33"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
fhir-ai-seed = "fhir_healthcare_ai.synthetic.cli:main"
fhir-ai-bench = "fhir_healthcare_ai.benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/martinoa2000/fhir-healthcare-ai"
Issues = "https://github.com/martinoa2000/fhir-healthcare-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_healthcare_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["fhir_healthcare_ai"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Optional extras (`[hf]`, `[openai]`, `[anthropic]`) are imported lazily and may be absent.
module = ["sklearn.*", "pandas.*", "respx.*", "openai.*", "anthropic.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live FHIR server (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/fhir_healthcare_ai"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
